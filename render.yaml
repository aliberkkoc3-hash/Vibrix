# Render Blueprint — Vibrix
services:
  - type: web
    name: vibrix
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: HOST
        value: 0.0.0.0
      - key: VIBRIX_DB
        value: /var/data/vibrix.db
    disk:
      name: vibrix-data
      mountPath: /var/data
      sizeGB: 1
